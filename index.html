<!doctype html>
<html lang="en"><head><meta charset="utf-8">
    <link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link rel="stylesheet" href="https://googleapis.com/css2?family=YOUR_FONT_HERE&display=swap" media="print" onload="this.media='all'">

    <meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Studio Nineteen Mumbai</title>
    
<body class="home-page"><main class="hero"><div class="hero-gallery" aria-label="Interior design photography"></div><div class="shade"></div>
<nav class="nav"><a href="contact.html">CONTACT</a><a href="https://www.instagram.com/studionineteenmumbai/" target="_blank" rel="noopener">@studionineteenmumbai</a></nav>
</main><script src="script.js" defer></script>

<style>


* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  width: 100%;
  overflow-x: hidden;
  font-family: Inter, Arial, sans-serif;
  color: #222;
}

a {
  color: inherit;
  text-decoration: none;
}

/* Home Page & Hero */
.home-page {
  overflow: hidden;
  background: #5b4c37;
}

.hero {
  height: 100vh; /* Fallback */
  height: 100dvh; /* Fits exact mobile screen height without browser bar cutoff */
  min-height: 440px;
  position: relative;
  background: #5b4c37;
}

.hero-gallery, .hero-gallery:after {
  position: absolute;
  inset: 0;
}

.hero-shot {
  position: absolute;
  inset: 0;
  background-position: center center;
  background-size: cover;
  opacity: 0;
  transition: opacity 1.5s ease;
}

.hero-shot.active {
  opacity: 1;
}

.shade {
  position: absolute;
  inset: 0;
  background: rgba(91, 76, 55, .30);
  pointer-events: none;
}

/* Navigation */
.nav {
  position: absolute;
  z-index: 2;
  right: 5.1vw;
  top: 52px;
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 22px;
  color: white;
  font: 700 16px Chivo, Arial, sans-serif;
  letter-spacing: .04em;
}

.nav a:hover, .inner-header a:hover {
  opacity: .65;
}

/* Inner Pages (Press & Contact) */
.inner-page {
  background: #fff;
}

.inner-header {
  height: 88px;
  padding: 0 5vw;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #eee;
}

.wordmark {
  font: 700 17px Chivo, Arial, sans-serif;
  letter-spacing: .12em;
}

.inner-header nav {
  display: flex;
  gap: 25px;
  font: 500 11px Chivo, Arial, sans-serif;
  letter-spacing: .12em;
}

.press-main {
  padding: 34px 5vw 70px;
}

.press-grid {
  columns: 4 190px;
  column-gap: 18px;
}

.press-item {
  display: block;
  break-inside: avoid;
  margin: 0 0 18px;
  background: #f4f2ef;
  overflow: hidden;
}

.press-item img {
  display: block;
  width: 100%;
  height: auto;
  transition: opacity .3s;
}

.press-item:hover img {
  opacity: .82;
}

.contact-main {
  max-width: 430px;
  margin: 13vh auto 0;
  padding: 0 25px 40px;
  text-align: center;
  font: 400 12px/1.8 Chivo, Arial, sans-serif;
  letter-spacing: .12em;
  overflow-wrap: break-word;
  word-wrap: break-word;
}

.contact-mark {
  max-width: 180px;
  max-height: 90px;
  object-fit: contain;
  margin: 0 auto 45px;
}

.contact-main address {
  font-style: normal;
  margin-bottom: 20px;
}

.contact-main p {
  margin: 5px 0;
}

.contact-main a:hover {
  text-decoration: underline;
}

/* Mobile & Tablet Breakpoint */
@media (max-width: 700px) {
  .nav {
    top: 24px;
    left: 20px;
    right: 20px;
    justify-content: space-between; /* Spreads links cleanly across top */
    font-size: 13px;
    gap: 12px;
  }

  .nav a {
    padding: 6px 0; /* Larger touch target for mobile fingers */
  }

  .inner-header {
    height: auto;
    min-height: 78px;
    padding: 18px 20px;
    align-items: flex-start;
    gap: 16px;
    flex-direction: column;
  }

  .inner-header nav {
    flex-wrap: wrap;
    gap: 16px;
  }

  .press-main {
    padding: 20px;
  }

  .press-grid {
    columns: 2 130px;
    column-gap: 10px;
  }

  .press-item {
    margin-bottom: 10px;
  }

  .contact-main {
    margin-top: 8vh;
    letter-spacing: .08em; /* Slightly tighter spacing so email fits on 1 line */
  }
}

/* Extra-small phones (e.g., iPhone SE / 360px wide) */
@media (max-width: 380px) {
  .nav {
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    font-size: 12px;
  }

  .press-grid {
    columns: 1; /* Single column on very narrow screens */
  }
}

@media (prefers-reduced-motion: reduce) {
  .hero-shot {
    transition: none;
  }
}
</style>
</body></html>
